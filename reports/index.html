<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{

.report-card:hover{transform:translateY(-2px);border-color:var(--primary)}
.card-left .title{font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.card-left .badge-latest{background:#10b981;color:#fff;font-size:11px;padding:2px 8px;border-radius:10px}
.card-left .desc{font-size:13px;color:var(--text2)}
